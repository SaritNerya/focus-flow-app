server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # כותרות אבטחה לכל התשובות. Referrer-Policy לא no-referrer: נגן YouTube צריך לדעת מאיזה אתר הוא מוטמע.
  # חשוב: location עם add_header משלו לא יורש את אלה — לכן בלוקים למטה לא משתמשים ב-add_header.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /config.js {
    expires -1;  # בלי מטמון (נוצר מחדש בכל עליית קונטיינר)
  }

  location ~ \.mjs$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  location ~ \.wasm$ {
    types { }
    default_type application/wasm;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
