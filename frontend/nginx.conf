server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location ~ \.mjs$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  location ~ \.wasm$ {
    types { }
    default_type application/wasm;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}